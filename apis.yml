description: 'Fortescue (Fortescue Ltd, ASX: FMG) describes itself as the technology, energy and metals group accelerating commercial decarbonisation of industry, rapidly, profitably and globally. Headquartered in Western Australia, it operates iron ore mining, rail and port operations in the Pilbara, alongside green energy, green metals and Fortescue Zero technology businesses. Its public web estate (fortescue.com, investors, careers, suppliers, capital and zero subdomains) publishes no developer portal, API documentation or public API. Surfaced via the API Evangelist harvest backlog (australia-apidays-2026).'

